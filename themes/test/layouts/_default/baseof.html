<!doctype html>
<html lang="en">
  <head>

    <!--
      Set embedded state and theme BEFORE CSS loads.
      This prevents the normal WhatMakeArt layout/theme from flashing
      before the Canvas integration script runs.
    -->
    <script>
      (() => {
        const root = document.documentElement;
        const embedded = window.parent !== window;
        const ua = navigator.userAgent || "";

        // Mark embedded pages immediately so Canvas-specific CSS can apply
        // before the first paint.
        if (embedded) {
          root.classList.add("canvas-embedded");
        }

        // Mobile/tablet detection used only for initial theme selection.
        const mobile =
          /iPhone|iPad|iPod|Android|Mobi|Mobile/i.test(ua) ||
          (navigator.platform === "MacIntel" &&
            navigator.maxTouchPoints > 1);

        let theme;

        if (embedded && !mobile) {
          // Canvas Web on desktop/laptop uses a light interface.
          theme = "light";
        } else if (embedded) {
          // Canvas mobile app / mobile WebView:
          // follow the appearance exposed by the WebView.
          theme = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches
            ? "dark"
            : "light";
        } else {
          // Normal WhatMakeArt website:
          // use saved site preference when available,
          // otherwise follow the operating system.
          let savedTheme = null;

          try {
            savedTheme = localStorage.getItem("theme");
          } catch (e) {
            // Storage may be unavailable in some browser contexts.
          }

          theme =
            savedTheme === "dark" || savedTheme === "light"
              ? savedTheme
              : window.matchMedia(
                  "(prefers-color-scheme: dark)"
                ).matches
                ? "dark"
                : "light";
        }

        root.setAttribute("data-bs-theme", theme);
        root.style.colorScheme = theme;
      })();
    </script>

    {{ partial "head/head" . }}

  </head>

  {{ block "body_override" . }}<body>{{ end }}

    {{ partialCached "skippy" . }}
    {{ partialCached "icons" . }}

    {{ partialCached "navbar-wiki" . }}

    {{ block "main" . }}
    {{ end }}

    {{ partial "footer" . }}
    {{ partialCached "scripts" . }}

    {{ block "footer" . }}
    {{ end }}

  </body>
</html>
